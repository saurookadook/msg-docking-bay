name: "Python setup"
description: "Install Python and uv, then install a uv project's locked dependencies"

inputs:
  project:
    description: "The uv project to install: backend or ingest"
    default: "backend"

runs:
  using: "composite"
  steps:
    - name: "Set up Python"
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version-file: "${{ inputs.project }}/.python-version"

    - name: "Install uv"
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.1" # same release as UV_IMAGE in backend/Dockerfile
        enable-cache: true
        cache-dependency-glob: "${{ inputs.project }}/uv.lock"

    - name: "Install dependencies"
      shell: bash
      working-directory: ${{ inputs.project }}
      run: uv sync --locked
