name: "Node.js setup"
description: "Install pnpm and Node.js, then install the frontend's dependencies"

# frontend/ is this repository's only Node root (no root package.json), so every step
# reads its files there (CI-5).
runs:
  using: "composite"
  steps:
    - name: "Install pnpm"
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (version comes from packageManager)
      with:
        package_json_file: "frontend/package.json"

    - name: "Set up Node.js"
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: "frontend/.nvmrc"
        cache: "pnpm"
        cache-dependency-path: "frontend/pnpm-lock.yaml"

    - name: "Install dependencies"
      shell: bash
      working-directory: frontend
      run: pnpm install --frozen-lockfile
