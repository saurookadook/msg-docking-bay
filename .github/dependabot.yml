# Every ecosystem that holds a version pin (ENV-24). .prototools is not supported by
# Dependabot; update it by hand (or adopt Renovate) together with .nvmrc,
# backend/.python-version, ingest/.python-version, and the moon versionConstraint.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule: { interval: "weekly" }
    cooldown: { default-days: 7 }
    groups:
      npm-minor-and-patch: { update-types: ["minor", "patch"] }
    ignore:
      # tools/api-codegen pins TypeScript 5: openapi-typescript needs its JS compiler
      # API, which TypeScript 7 doesn't ship. Ignore rules can't target one workspace
      # package, so this also holds back the app's TypeScript majors; upgrade those by
      # hand.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule: { interval: "weekly" }
    cooldown: { default-days: 7 }
    groups:
      uv-minor-and-patch: { update-types: ["minor", "patch"] }
  # Its shared packages must match backend/uv.lock: after either PR, run
  # `moon run ingest:lock-drift`, which prints the command that realigns ingest.
  - package-ecosystem: "uv"
    directory: "/ingest"
    schedule: { interval: "weekly" }
    cooldown: { default-days: 7 }
    groups:
      uv-minor-and-patch: { update-types: ["minor", "patch"] }
  - package-ecosystem: "docker"
    directories: ["/backend", "/frontend", "/ingest", "/postgres"]
    schedule: { interval: "weekly" }
    cooldown: { default-days: 7 }
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule: { interval: "weekly" }
    cooldown: { default-days: 7 }
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows; each composite action needs its own entry.
    directories: ["/", "/.github/actions/*"]
    schedule: { interval: "weekly" }
    cooldown: { default-days: 7 }
    groups:
      actions-minor-and-patch: { update-types: ["minor", "patch"] }
