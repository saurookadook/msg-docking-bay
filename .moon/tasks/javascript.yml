$schema: '../cache/schemas/tasks.json'

inheritedBy:
  toolchains: { or: ['javascript', 'typescript'] }

fileGroups:
  sources: ['src/**/*']
  tests: ['src/**/*.test.ts', 'src/**/*.test.tsx']
  configs: ['package.json', 'tsconfig*.json', '*.config.ts', '*.config.js']

# frontend/ is its own pnpm root, so the oxfmt and oxlint configs live in the project,
# not at the workspace root.
tasks:
  format:
    command: 'oxfmt'
    # NOTE: given only files oxfmt can't format (fonts, images, .txt), it finds no target
    # and exits 2, so a commit of assets alone would fail the pre-commit hook.
    args: ['--check', '--no-error-on-unmatched-pattern']
    inputs: ['@group(sources)', '@group(configs)', '.oxfmtrc.json']
    options:
      affectedFiles: true
  lint:
    command: 'oxlint'
    # NOTE: a staged file that `.oxlintrc.json` ignores (src/api/generated/) still passes
    # the filter below, and oxlint exits 1 when it is left with nothing to lint.
    args: ['--type-aware', '--deny-warnings', '--no-error-on-unmatched-pattern']
    deps: ['^:build']
    inputs: ['@group(sources)', '@group(configs)', '.oxlintrc.json']
    options:
      # Pass only JS/TS files: given only package.json or tsconfig.json, oxlint finds
      # nothing to lint and exits 1 (MTASK-6). oxfmt formats JSON, so format passes all.
      affectedFiles:
        pass: 'args'
        filter: ['**/*.{ts,tsx,js,jsx,mjs,cjs}']
  typecheck:
    command: 'tsc'
    args: ['--build', '--noEmit']
    deps: ['^:build']
    inputs: ['@group(sources)', '@group(configs)']
  format-write:
    command: 'oxfmt'
    preset: 'utility'
  lint-fix:
    command: 'oxlint'
    args: ['--type-aware', '--fix']
    preset: 'utility'
