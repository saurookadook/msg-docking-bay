# NOTE: frontend/ is the repo's only pnpm root. Besides pnpm's settings, this file lists
# tools/*: private build tools that need dependencies the app can't share, such as
# api-codegen's TypeScript 5. They share this lockfile.
packages:
  - 'tools/*'
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@vitest/coverage-v8@5.0.4'
  - '@vitest/mocker@5.0.4'
  - '@vitest/spy@5.0.4'
  - cssnano-preset-default@9.7.0
  - cssnano@9.7.0
  - postcss-merge-rules@9.1.5
  - postcss-minify-params@9.1.0
  - vitest@5.0.4
