<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MSG Docking Bay</title>
    <script>
      // Applies the stored deck shift before first paint, so a Night shift never flashes
      // Day colors. Mirrors SHIFT_LS_KEY and SHIFTS (src/constants); src/app/indexHtml.test.ts
      // runs this script to keep the two in step.
      try {
        var storedShift = JSON.parse(localStorage.getItem('msgdb.shift'));
        if (storedShift === 'day' || storedShift === 'night') {
          document.documentElement.dataset.shift = storedShift;
        }
      } catch (error) {
        // Storage disabled or the value is not JSON: stay on the OS color scheme.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
