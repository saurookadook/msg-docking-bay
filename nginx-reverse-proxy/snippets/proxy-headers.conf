# Included by every proxied location. NGINX inherits proxy_set_header only into locations
# that set none of their own, so the WebSocket locations would otherwise lose these.
proxy_http_version 1.1;
proxy_set_header Host              $http_host; # keeps a non-443 port (ENV-38)
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $http_host;
