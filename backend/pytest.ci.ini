[pytest]
addopts = -ra
          --color=yes
          --code-highlight=yes
          --cov=.
          --cov-report=term-missing
norecursedirs = .*
python_files = test_*.py test.py
testpaths = api config db utils
strict = true
required_plugins = pytest-cov>=7.0.0,<8.0.0
                   pytest-mock>=3.14.0,<4.0.0
                   pytest-sugar>=1.0.0,<2.0.0
                   pytest-xdist>=3.5.0,<4.0.0
