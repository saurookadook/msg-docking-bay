[pytest]
addopts = -ra
          -vvv
          --color=yes
          --code-highlight=yes
          -s
log_cli = true
log_cli_level = NOTSET
norecursedirs = .*
python_files = test_*.py test.py
testpaths = api config utils
strict = true
required_plugins = pytest-mock>=3.14.0,<4.0.0
                   pytest-sugar>=1.0.0,<2.0.0
                   pytest-xdist>=3.5.0,<4.0.0
