$schema: './.moon/cache/schemas/project.json'

layer: 'automation'
project:
  title: 'Repository root'
  description: 'Local environment tasks: setup, the Docker Compose stack, and publishing.'
  owner: 'team-platform'

workspace:
  inheritedTasks:
    include: []

tasks:
  setup:
    command: 'scripts/setup-local.sh'
    inputs: []  # one-off side effects; depends on no tracked file's content
    preset: 'utility'
  dev:
    command: 'docker'
    args: ['compose', 'up', '--build', '--watch', '--attach-dependencies', 'all']
    preset: 'server'
  down:
    command: 'docker'
    args: ['compose', 'down']
    preset: 'utility'
  # Builds every production image in docker-bake.hcl and pushes them to Docker Hub in one
  # login (ENV-41). `moon run <project>:publish` pushes one.
  publish:
    command: 'scripts/publish-images.sh'
    inputs: []  # pushes images; nothing to cache
    preset: 'utility'
    options:
      runInCI: false
