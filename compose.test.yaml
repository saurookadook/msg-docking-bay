# Overrides for the test Compose project only (scripts/backend-test.sh). Never use these
# settings for a database whose data matters (PG-17).
services:
  postgres:
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    volumes: !override
      - postgres-secrets:/run/secrets:ro
    tmpfs:
      - /var/lib/postgresql
